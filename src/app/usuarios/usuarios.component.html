<mat-card>
    <h2 style="margin-bottom: 20px;">Lista de Usuarios</h2>
    <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 20px;">
        <mat-label>Buscar usuario</mat-label>
        <input matInput (keyup)="aplicarFiltro($event)" placeholder="Filtrar por nombre, correo o rol">
      </mat-form-field>
      
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
  
      <!-- Nombre Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Nombre </th>
        <td mat-cell *matCellDef="let usuario"> {{usuario.nombre}} </td>
      </ng-container>
  
      <!-- Correo Column -->
      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef> Correo </th>
        <td mat-cell *matCellDef="let usuario"> {{usuario.correo}} </td>
      </ng-container>
  
      <!-- Rol Column -->
      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef> Rol </th>
        <td mat-cell *matCellDef="let usuario"> {{usuario.rol}} </td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
  </mat-card>
